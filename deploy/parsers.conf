[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z


# Docker's json-file driver wraps each line as {"log":"...","stream":"stdout","time":"..."}.
# Needed by the tail input below: containers that log via json-file (the MCP
# connectors) are collected from disk rather than pushed over the forward port.
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
