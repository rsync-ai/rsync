# Traefik Static Configuration for rsync-ai
# Docs: https://doc.traefik.io/traefik/

api:
  dashboard: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

certificatesResolvers:
  letsencrypt:
    acme:
      # Email is set via TRAEFIK_CERTIFICATESRESOLVERS_letsencrypt_ACME_EMAIL env var
      storage: /letsencrypt/acme.json
      # DNS challenge required when Cloudflare proxy (orange cloud) is enabled.
      # HTTP challenge fails because Cloudflare intercepts port 80 before
      # Let's Encrypt can verify it.
      dnsChallenge:
        provider: cloudflare
        # Use Cloudflare's own resolvers to avoid propagation delays
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

providers:
  docker:
    # Use docker-socket-proxy over TCP instead of mounting the raw socket.
    # This avoids the API v1.24 negotiation bug in Traefik's Go Docker client
    # when running against Docker 27+ (which requires API >= 1.40).
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: rsync-ai_default
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
