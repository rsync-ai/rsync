[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Second collection path, for containers using Docker's json-file driver.
#
# The MCP connectors moved off the fluentd driver deliberately: with
# `fluentd-async: true` a container whose collector is absent buffers in the
# DAEMON, silently and without bound, and with it false the container will not
# start at all — either way a self-host box that ships no fluent-bit pays for a
# log pipeline it does not have. json-file has no such coupling, and tailing it
# from here keeps those logs flowing on stacks that DO run fluent-bit.
#
# No double-collection: a container using the fluentd driver writes no
# json-file at all, so the two inputs cover disjoint sets.
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/log/flb-state/tail.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Parse JSON logs from Docker containers
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On

# Forward to OTel Collector via fluentforward protocol
[OUTPUT]
    Name          forward
    Match         *
    Host          otel-collector
    Port          8006
    Retry_Limit   5

