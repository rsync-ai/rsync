# Client-side logging for RoundTrip.java: warnings and errors only, on stderr,
# so stdout carries nothing but the RESULT line.
log4j.rootLogger=WARN, E
log4j.appender.E=org.apache.log4j.ConsoleAppender
log4j.appender.E.Target=System.err
log4j.appender.E.layout=org.apache.log4j.PatternLayout
log4j.appender.E.layout.ConversionPattern=%p %c{1} %m%n
