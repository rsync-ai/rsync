{{/*
The chart-managed Kafka TLS material.

A Secret of its own rather than more keys on the main one, because this material
is mounted as FILES and the main Secret may be an existingSecret the operator
owns -- one they would then have to know to extend with a key they never asked
for. Keeping it separate also means `kafka.external.tls.existingSecret` can
replace this whole object without touching anything else.

Rendered only when the chart is the thing that holds the material: with
existingSecret set, this file produces nothing and the volume points at the
operator's Secret instead.

Note the guard is on the MATERIAL, not on securityProtocol. The Secret existing
is harmless; what must be protocol-gated is whether anything mounts or reads it,
and that lives in rsync-ai.kafka.usesTLS. Gating here as well would mean a
protocol flip silently deleting the object a running pod has mounted.
*/}}
{{- $tls := .Values.kafka.external.tls | default dict -}}
{{- if and (not .Values.kafka.enabled) (not $tls.existingSecret) -}}
{{- if or $tls.caCert (and $tls.clientCert $tls.clientKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rsync-ai.fullname" . }}-kafka-tls
  labels:
{{- include "rsync-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-tls
type: Opaque
stringData:
  {{- with $tls.caCert }}
  ca.crt: |
{{ . | trim | indent 4 }}
  {{- end }}
  {{- if and $tls.clientCert $tls.clientKey }}
  tls.crt: |
{{ $tls.clientCert | trim | indent 4 }}
  tls.key: |
{{ $tls.clientKey | trim | indent 4 }}
  {{/*
  Kafka Connect's PEM keystore is a SINGLE file holding the certificate chain
  and the private key; there is no way to hand it the two paths above. The Go
  and Python clients want them separate. So both shapes are stored, from one
  source of truth, rather than asking the operator to paste the same material
  twice and keep the copies in step.
  */}}
  client.pem: |
{{ printf "%s\n%s" ($tls.clientCert | trim) ($tls.clientKey | trim) | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
