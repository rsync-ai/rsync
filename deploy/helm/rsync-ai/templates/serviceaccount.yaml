{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rsync-ai.serviceAccountName" . }}
  labels:
{{- include "rsync-ai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
{{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
No token is mounted. Nothing in this platform talks to the Kubernetes API — the
one component that needed a container runtime (connector-deployer) is absent
from this chart by design. The annotations above exist for IRSA / GKE Workload
Identity / AKS workload identity, which project their own token through a
separate volume and do not need this one.
*/}}
automountServiceAccountToken: false
{{- end }}
