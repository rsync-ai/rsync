{{- if not .Values.secrets.existingSecret }}
{{/*
Rendered only when the operator has NOT supplied their own Secret. Helm stores
release values — including everything below — in the release Secret in
cleartext, so anything leaving a laptop should set `secrets.existingSecret` and
manage these through External Secrets / SOPS / sealed-secrets / a CSI driver.

The keys are named after the environment variables the services read, so a
hand-managed Secret can be written by reading this file and nothing else.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rsync-ai.secretName" . }}
  labels:
{{- include "rsync-ai.labels" . | nindent 4 }}
  annotations:
    {{/*
      Kept across upgrades even if the release is rolled back to values that no
      longer contain the key: losing ENCRYPTION_KEY makes every stored
      connection credential permanently undecryptable.
    */}}
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  {{- if .Values.secrets.internalServiceSecret }}
  INTERNAL_SERVICE_SECRET: {{ .Values.secrets.internalServiceSecret | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when postgresql.enabled=true" .Values.secrets.postgresPassword | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
  {{/*
  No `required` here, deliberately -- validate.yaml owns this message. This file
  is pulled in by demo-warehouse.yaml for its checksum annotation, and a
  `required` firing from inside that include beats every guard in validate.yaml
  to the punch: an operator who enabled the demo with no `postgresql` in
  connectors.fleet would be told about the password first, fix it, and only then
  learn about the fleet. The first message has to name the whole mistake.
  */}}
  {{- if .Values.demo.enabled }}
  DEMO_WAREHOUSE_PASSWORD: {{ .Values.secrets.demoWarehousePassword | quote }}
  {{- end }}
  {{- if eq .Values.objectStorage.mode "minio" }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  {{- if .Values.objectStorage.external.accessKeyId }}
  OBJECT_STORAGE_ACCESS_KEY_ID: {{ .Values.objectStorage.external.accessKeyId | quote }}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: {{ .Values.objectStorage.external.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.kafka.external.saslPassword }}
  KAFKA_SASL_PASSWORD: {{ .Values.kafka.external.saslPassword | quote }}
  {{- end }}
  {{/*
  A separate condition, not a second line under saslPassword: OAUTHBEARER has no
  password at all, so nesting the two together means the client secret is never
  written -- and the env var references it with optional:true, so the pod starts
  anyway and fails later against the IdP with an error that names neither
  setting. Caught by rendering, not by lint.
  */}}
  {{- if (.Values.kafka.external.oauth | default dict).clientSecret }}
  KAFKA_SASL_OAUTHBEARER_CLIENT_SECRET: {{ .Values.kafka.external.oauth.clientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.oauth }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
