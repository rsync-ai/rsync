{{- if .Values.connectors.sampleData.enabled }}
{{- $fullname := include "rsync-ai.fullname" . }}
{{/*
The zero-credential demo source. It exists so a cluster that has just finished
`helm install` has something a human can actually run a pipeline against before
they have produced a single secret -- it is the only connector in the catalog
with auth_type "none".

Kubernetes parity is the whole point of this file. The connector catalog is
baked into the connector-seed image and is therefore IDENTICAL on compose and on
Kubernetes, so sample-data is offered in the UI on both. If only compose starts
a container for it, the Kubernetes install offers a connector whose connection
test resolves nothing -- the same defect this connector had on every install
until the quickstart gained a service block, just moved to the platform that is
harder to debug.

The Service name is NOT cosmetic and is NOT release-prefixed, for the same
reason as minio-mcp beside it: the orchestrator resolves connector hosts
literally as

    http://<STACK_PREFIX>-sample-data-v1-0-0-mcp:8000/health
    (MCPContainerName, internal/mcp/server_manager.go:310)

Rename this Service and discovery looks for a host that does not exist.
*/}}
{{- $name := include "rsync-ai.connectorServiceName" (dict "prefix" .Values.global.stackPrefix "id" "sample-data" "version" "v1.0.0") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rsync-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: sample-data-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "rsync-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sample-data-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-sample-data-mcp
  labels:
    {{- include "rsync-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: sample-data-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rsync-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sample-data-mcp
  template:
    metadata:
      labels:
        {{- include "rsync-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: sample-data-mcp
        {{- with .Values.global.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "rsync-ai.podBoilerplate" . | nindent 6 }}
      containers:
        - name: sample-data-mcp
          image: {{ include "rsync-ai.image" (dict "root" . "image" .Values.connectors.sampleData.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "rsync-ai.commonEnv" . | nindent 12 }}
            - name: PORT
              value: "8000"
            # Without this the connector starts in stdio mode and answers no
            # HTTP at all, so discovery's GET /health never succeeds — which
            # looks like a crash-looping pod that is in fact perfectly healthy.
            - name: MCP_HTTP_MODE
              value: "true"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.connectors.sampleData.resources | nindent 12 }}
{{- end }}
