apiVersion: v2
name: rsync-ai
description: >-
  rsync.ai data-movement platform — cloud-agnostic Kubernetes chart. Runs the
  same images as the compose stack; EKS, GKE and AKS differ only by values file.
type: application

# Chart version. Released in lockstep with appVersion: the workflow derives both
# from the same git tag, so a chart and the images it points at are never skewed.
version: 0.1.3

# appVersion is the image tag the chart defaults to (global.image.tag is empty,
# so every component resolves through here). The release job overwrites BOTH this
# and `version` with the git tag via `helm package --version/--app-version`, so
# the values below only matter for `helm install ./deploy/helm/rsync-ai` from a
# checkout. Keep them at the latest COMPLETE release.
#
# This is load-bearing rather than cosmetic: the tag named here has to be one whose
# release run published EVERY image the chart pins, or the install comes up with a
# permanent ImagePullBackOff on the ones it missed. Two earlier tags failed that
# test -- v0.1.0's mcp-minio job errored (a Dockerfile deleted by #184; fixed in
# #854), and v0.1.1 predates llm-service-oss and connector-lifecycle joining the
# build matrix. v0.1.2's run was 36/36, and all 34 packages answer anonymously at
# that tag. Do not move this backwards without re-checking the run behind it.
#
# A second property is just as load-bearing: the tag has to be MULTI-ARCH. 0.1.2
# was built before the workflow added linux/arm64, so every image in it is
# amd64-only -- an install on Apple Silicon, Graviton, Axion or Ampere nodes sat in
# ErrImagePull ("no match for platform in manifest"). 0.1.3 is the first tag built
# for both, checked 2026-09-21 by anonymous manifest fetch: all 33 images the chart
# and the installer can name (13 chart images + 20 connectors) list amd64 and arm64.
# Re-check that, not just that the images exist, before moving this again.
appVersion: "0.1.3"

keywords:
  - etl
  - cdc
  - data-pipeline
  - kafka
  - debezium
home: https://rsync.ai
sources:
  - https://github.com/rsync-ai/rsync
maintainers:
  - name: rsync.ai
    url: https://github.com/rsync-ai/rsync

annotations:
  # There are no chart dependencies on purpose. Bitnami's postgresql/kafka/redis
  # subcharts would drag in their own image registries, their own upgrade
  # semantics and their own CVE cadence — and the whole point of the BYO toggles
  # is that a customer running managed RDS/MSK/ElastiCache disables ours anyway.
  # The in-chart infra is a *dev-grade* single replica, spelled out in values.yaml.
  artifacthub.io/prerelease: "true"
