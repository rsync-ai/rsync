# Logger levels rsync.ai adds to the Kafka Connect worker's log4j.properties.
#
# sync-log4j-loggers.sh appends each line here to /kafka/config/log4j.properties at
# every container start, unless that file already sets the logger -- an operator's
# level wins. Only log4j.logger.* lines are read; appenders and the root logger stay
# as the base image has them. Logger names are case-sensitive, which is why these
# cannot go through CONNECT_LOG4J_* (the base entrypoint lowercases those names).

# The two pgoutput WARNs a FOR ALL TABLES publication produces for every table
# OUTSIDE a pipeline. The publication streams RELATION messages for all tables, and
# Debezium 3.1's PgOutputMessageDecoder.handleRelationMessage runs its JDBC metadata
# lookup before any table filter, so a keyless table the connector does not capture
# still logs "Primary keys are not defined for table '...'" and "Column '...'
# optionality could not be determined" (every 5 min on prod for `*__rsync_new` swap
# tables, 2026-09-24). Those two are the class's only WARNs; its one ERROR ("Failed
# to read column metadata") still prints. A keyless table INSIDE a pipeline is
# reported by rsync.ai's own PK gate before the connector starts, not by this log line.
log4j.logger.io.debezium.connector.postgresql.connection.pgoutput.PgOutputMessageDecoder=ERROR
