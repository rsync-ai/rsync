name: CI

on:
  pull_request:
    # Docs-only / housekeeping changes never affect CI — skip the whole run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  # No `push: branches: [main]`, on purpose (2026-09-27). A push run re-did the
  # PR's own work: on a push, dorny/paths-filter diffs the squash commit, which IS
  # the PR's diff, so it picked the same jobs the PR had just passed. From
  # 2026-09-26 08:10 to 09-27 07:08 UTC it cost 211 runner-min here (and 161 more
  # in security.yml) out of 1,540 -- on four runners whose p90 wait was 11-28 min.
  # It also killed the nightly: both runs share the concurrency group
  # ci-refs/heads/main, so merge run 36247715314 cancelled schedule run
  # 36245965147 32 min in. The one thing only a push run could catch -- two PRs
  # each green alone, broken together -- the nightly catches now, because on
  # schedule and workflow_dispatch every filtered job below runs in full. (Left to
  # its filter, a schedule run would diff only main's LAST commit: the event has
  # no `before`, so dorny falls back to it.)
  workflow_dispatch:
  # Nightly trigger for the non-blocking a11y suite. It used to run on
  # every PR purely to upload a report (continue-on-error, known-unfixed
  # violations), adding a full Playwright build+browser run to the PR
  # critical path for zero gating value. Moved off PRs onto a nightly
  # cron so violations are still tracked without slowing every push.
  schedule:
    # 09:00 UTC. The hour was chosen to be off-peak on the self-hosted Macs
    # this workflow ran on; on hosted runners nothing makes one hour cheaper.
    - cron: '0 9 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter needs `pull-requests: read` to call the PR
# listFiles API; without it the action fails with
# `Resource not accessible by integration`.
permissions:
  contents: read
  pull-requests: read

# No workflow-level AGENT_TOOLSDIRECTORY, and none needed. The setup-go /
# setup-python / setup-node actions default their tool cache to
# /Users/runner/hostedtoolcache, which is the hosted runner's own user and
# where they write here. That path did not exist on the self-hosted Macs this
# workflow ran on before the flip-day split, so each of those runners exported
# its own AGENT_TOOLSDIRECTORY from ~/.env, giving every parallel runner a
# private _work/_tool dir instead of racing on a shared one.
#
# The note outlives the runners because the wrong fix does: setting the
# variable at workflow level would override a per-runner value, and would still
# be the wrong place if any job ever went back.

jobs:
  # Why there is no `changes` job
  #
  # Change detection used to be its own job that nine jobs waited on via
  # `needs:`. That `needs:` did not cost the ~11 s the job ran -- it cost a
  # second trip through the runner queue. Four self-hosted agents serve every
  # workflow in this repo, and measured across runs 36025851448, 36024668512
  # and 36023391830, `Detect changes` itself waited 495-925 s for a slot, then
  # its dependents waited another 153-907 s once it released one. Two
  # traversals of a queue that deep dwarfed the 1440 s of real work the whole
  # run contains. `frontend-a11y`, needing both, paid three.
  #
  # So each job runs the filter itself, from the single definition in
  # .github/paths-filters.yml, and gates its own steps on `env.RUN`. A job with
  # nothing to do now costs one checkout (~11 s) instead of reporting `skipping`
  # for free -- cheap against a queue traversal, and it buys every job the right
  # to start at t=0. The same reasoning that merged ten Go module jobs into one
  # below: on this fleet a job boundary costs far more than it saves.

  # Deliberately UNFILTERED even though the rest of ci.yml now filters itself. It
  # is a sub-second pure-grep check, and a paths-filter that excluded the very file
  # it protects is exactly how KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW happened.
  # Running it unconditionally costs nothing and cannot be filtered wrong.
  #
  # Guards a failure mode that no other job can see: a `${VAR:?}` in a shipped compose
  # file whose value no shipped template supplies. One `:?` aborts interpolation for
  # the WHOLE merged config, so the symptom is not a degraded service — nothing starts.
  # It only bites a FRESH stand-up (an existing host's .env already has the variable),
  # i.e. precisely a cloud migration, which is when it is most expensive.
  #
  # Second step, added 2026-09-27: a PR titled `fix:`/`fix(scope):` must change a
  # test file, or say why not on a `No-test: <reason>` line in its description. It
  # lives here rather than in a job of its own because every job costs a queue wait
  # on every PR, and this is the one job that already runs on every PR unfiltered.
  # It reads the PR from the API, hence GH_TOKEN and `pull-requests: read` above.
  env-templates:
    name: Env templates + fix PR has a test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/check-env-templates.sh
      - name: A fix PR changes a test, or says why not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PY=/opt/homebrew/opt/python@3.11/bin/python3.11; [ -x "$PY" ] || PY=python3
          "$PY" scripts/check-fix-has-test.py

  # ONE job for every Go module, not a job per module. This used to be three
  # jobs -- a 4-way `go` matrix, a 5-way `go-shared` matrix and `sink-worker`
  # -- so a push touching all three areas asked for ten runners, each spending
  # more time on checkout + setup-go than on its tests. Four runners serve
  # every workflow in this repo, so in a burst those ten small jobs were the
  # ones still waiting at the end: in runs 35227539603, 35230181816 and
  # 35227063653 each Go module job took 11-36 s, but started 36-70 min after
  # the run's first job. One job asks for one runner.
  #
  # The three change-detection outputs still decide what runs: the module
  # list below is built from them, so a sink-only PR still does not rebuild
  # the service modules. Every selected module runs even after one fails
  # (the matrices' fail-fast: false), and the job fails at the end naming each.
  go:
    name: Go
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Change detection, inlined -- see "Why there is no `changes` job" above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/paths-filters.yml
      # RUN is this job's only gate. EVERY step below carries `if: env.RUN == '1'`,
      # and llm-service/tests/test_ci_inline_change_filters.py fails if one does not:
      # an unguarded step would work on a PR that changed none of this job's paths,
      # and a step wrongly left outside the gate would report green having done
      # nothing -- KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW, same class.
      - name: Does this job have anything to do?
        env:
          WANTED: ${{ steps.filter.outputs.go == 'true' || steps.filter.outputs.go-shared == 'true' || steps.filter.outputs.sink == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$WANTED" = 'true' ]; then
            echo 'RUN=1' >> "$GITHUB_ENV"
          else
            echo 'RUN=0' >> "$GITHUB_ENV"
            echo '::notice title=Go skipped::no path this job filters on changed'
            echo '`Go` -- skipped: no path this job filters on changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # The job's own Go is api-gateway's toolchain. A module that declares a
      # different `toolchain` in its go.mod still gets exactly that one: the
      # loop below sets GOTOOLCHAIN per module, and the go command downloads
      # it into the module cache on first use. A module with no `toolchain` line
      # (correlation, crypto, naming, transforms) runs on this job's Go -- the
      # toolchain the services that compile it are built with -- rather than
      # the newest 1.23.x / 1.24.x its `go` line would otherwise resolve to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: env.RUN == '1'
        with:
          go-version-file: api-gateway/go.mod
          # Disable setup-go's built-in auto-cache. It saves the entire global
          # ~/go/pkg/mod (~2.95 GB) at job end via a "Post Run" step, and
          # nothing here restores a Go cache either -- see the note below -- so
          # this flag is not compensating for a cache step, it is the whole Go
          # caching policy for this job.
          #
          # It was CRITICAL while these jobs ran on the self-hosted Macs: at the
          # 0.1-0.2 MB/s those boxes uploaded at, the Post Run step ran for
          # hours, hit a GitHub cache-API auth error and failed the job with
          # every test passed. On a hosted runner the same upload is merely
          # wasted, since the next run gets a fresh box with nothing to restore
          # into. (It used to cite an explicit "Cache go build + modules" step;
          # that step was removed with the module cache and the citation
          # outlived it, describing a saving no run has made since.)
          cache: false
      # NO GitHub actions/cache for the Go caches -- and unlike most notes in
      # this file, this one does NOT simply carry over the runner move.
      #
      # actions/cache exists to ferry state between EPHEMERAL runners, and the
      # reason there was none here is that these runners were not ephemeral:
      # the jobs ran on persistent Macs where both ~/go/pkg/mod and
      # ~/Library/Caches/go-build survived on local disk between runs, so
      # `go test` reused a warm build cache with zero round-trip. Uploading the
      # ~1.4 GB build cache via actions/cache@v6 at ~1 MB/s added a ~9-min
      # "Post Cache" step to every Go job for no benefit, so it was removed.
      #
      # ubuntu-latest is ephemeral. Every run is now a cold compile and that
      # argument is gone, so the absence here is a not-yet rather than a
      # conclusion: a cache would be a real speedup, and one added without a
      # measured key is the opposite failure -- a warm-looking job restoring a
      # stale tree. Measure before adding one. Do not add one merely because
      # this comment no longer forbids it.
      #
      # Why each module is on its list:
      # - connector-deployer (SEC-H-02): the trusted socket-holder that replaces
      #   tool-generator's raw docker.sock access. Own Go module
      #   (github.com/rsync-ai/connector-deployer), tested here so a change
      #   can't ship unbuilt/unscanned.
      # - shared/go/naming: consumed by api-gateway + orchestrator via
      #   `replace`, but `replace` only builds it, it never runs the module's
      #   *_test.go. Its tests (ValidateNamespace / IsSuspiciousIdentifier)
      #   gatekeep destination namespace/identifier safety, a data path. No
      #   go.sum (no external deps); the go-shared filter covers shared/go/**.
      # - shared/go/pgdriver: the pgx shim every Go service reaches PostgreSQL
      #   through (#830). Same reason as naming. Leaving it out would mean
      #   preprotocol_dos_test.go -- the regression test for GO-2026-6173, the
      #   advisory the whole module exists to close -- never ran in CI.
      # - shared/go/kafkaclient: every Go service's Kafka config, TLS and SASL
      #   (FromEnvForService). Same reason again: four modules `replace` it, so
      #   it was built on every Go PR while its own config/auth tests never ran.
      # - shared/go/memlimit: the cgroup-derived GOMEMLIMIT every Go service and
      #   the sink worker set at startup. Same reason: `replace` builds it but
      #   never runs memlimit_test.go, whose real-runtime case is the only check
      #   that the soft limit actually reaches the Go runtime.
      # - the kafka-mcp-sink worker is its own module outside both lists above,
      #   so its data-critical unit tests (table normalization, namespace
      #   routing, CDC/batch message parsing, DLQ handling) otherwise never
      #   run. It `replace`s ../../../../go/transforms; actions/checkout pulls
      #   the whole repo so that relative path resolves.
      - name: go test (includes build + vet via compiler)
        if: env.RUN == '1'
        env:
          # Nightly and on demand: every module, whatever main's last commit touched.
          SERVICES: ${{ steps.filter.outputs.go == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          SHARED: ${{ steps.filter.outputs.go-shared == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          SINK: ${{ steps.filter.outputs.sink == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        # `go test ./...` compiles every package, so the explicit
        # `go build` + `go vet` steps that used to run before were
        # redundant — `go test` already runs the same compile checks
        # and `go vet -all` style analyses (subsumed since Go 1.10).
        # Removing them saves a clean rebuild per job.
        #
        # `-race` is off, and after the flip-day split that is a deliberate
        # hold, not a platform limit. It was dropped because `-race` emits
        # binaries missing LC_UUID on macOS arm64 and dyld aborts before any
        # test runs; this job now runs on ubuntu-latest, where that bug does
        # not apply. Turning it on changes what the suite can fail on, so it
        # belongs in its own PR that can be judged on the races it finds --
        # bundled into a runner move, a red job would be indistinguishable
        # from a broken split.
        run: |
          modules=""
          if [ "$SERVICES" = true ]; then
            modules="$modules api-gateway backend-orchestrator backend-temporal-adapter connector-deployer"
          fi
          if [ "$SHARED" = true ]; then
            modules="$modules shared/go/correlation shared/go/crypto shared/go/transforms shared/go/naming shared/go/pgdriver shared/go/kafkaclient shared/go/memlimit"
          fi
          if [ "$SINK" = true ]; then
            modules="$modules shared/mcp-connectors/internal/kafka-mcp-sink/worker-src"
          fi
          failed=""
          for m in $modules; do
            tc=$(awk '$1 == "toolchain" { print $2; exit }' "$m/go.mod")
            echo "::group::go test $m (${tc:-$(go env GOVERSION)})"
            if ! (cd "$m" && GOTOOLCHAIN="${tc:-local}" go test -timeout 5m ./...); then
              failed="$failed $m"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=go test failed::$failed"
            exit 1
          fi

  llm-service-unit:
    name: llm-service unit tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags, not just the tip. test_shipped_images_are_publishable.py asks
          # what the RELEASE TAG built -- `latest` is minted only on a tag, so the
          # tag's build matrix is what decides whether a shipped image exists,
          # and HEAD's does not. The default shallow checkout fetches no tags at
          # all, which made that suite report "the tag v0.1.1 does not exist in
          # this repository" -- a false statement about a tag that does exist and
          # was simply never fetched. A check that cannot tell absence from
          # not-having-looked is the exact failure it was written to catch.
          fetch-depth: 0
      # Change detection, inlined -- see "Why there is no `changes` job" above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/paths-filters.yml
      # RUN is this job's only gate. EVERY step below carries `if: env.RUN == '1'`,
      # and llm-service/tests/test_ci_inline_change_filters.py fails if one does not:
      # an unguarded step would work on a PR that changed none of this job's paths,
      # and a step wrongly left outside the gate would report green having done
      # nothing -- KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW, same class.
      - name: Does this job have anything to do?
        env:
          WANTED: ${{ steps.filter.outputs.llm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$WANTED" = 'true' ]; then
            echo 'RUN=1' >> "$GITHUB_ENV"
          else
            echo 'RUN=0' >> "$GITHUB_ENV"
            echo '::notice title=llm-service unit tests skipped::no path this job filters on changed'
            echo '`llm-service unit tests` -- skipped: no path this job filters on changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # This job used to skip `actions/setup-python` and hard-code the brew
      # interpreter: the action writes `/Users/runner/hostedtoolcache/...`,
      # which a self-hosted Mac cannot create regardless of RUNNER_TOOL_CACHE
      # or AGENT_TOOLSDIRECTORY. The flip-day fork-safety split moved this job
      # to ubuntu-latest, where that tool cache is exactly what the action is
      # built to write — so the action is now the right way to pin 3.11, and
      # the bare `python3` below resolves to it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN == '1'
        with:
          python-version: '3.11'
      - name: Set up Python venv
        if: env.RUN == '1'
        run: |
          PY=python3
          $PY --version
          # Venv lives in a stable path outside the workspace so it survives
          # runner cleanup between jobs. Activating is just adding bin/ to PATH.
          #
          # The path carries the requirements.txt hash -- the SAME hash the cache
          # key below uses -- so a venv directory means exactly one dependency
          # set. It used to be one shared `llm-ci` for every job on this host,
          # and that is a data race, not a hygiene question: four runner installs
          # share one $HOME, so two jobs whose requirements.txt differ ran
          # `pip install` into the same site-packages at the same time. On
          # 2026-08-31 that produced a venv holding TWO pydantic dist-infos --
          # 2.13.5 (wants pydantic-core==2.46.5) and 2.13.4 (wants ==2.46.4) --
          # with 2.13.4's code live and 2.46.5 installed:
          #   SystemError: The installed pydantic-core version (2.46.5) is
          #   incompatible with the current pydantic version, which requires 2.46.4
          # Collection died, so the whole suite failed, on a PR that touched no
          # Python at all. Worse, pip could not repair it: it reads dist-info to
          # decide what is installed, saw 2.13.5's leftover metadata, printed
          # "Requirement already satisfied: pydantic>=2.13.5 ... (2.13.5)" and
          # skipped the one package that needed rewriting. Torn state that the
          # installer reports as satisfied does not heal on a re-run.
          #
          # This is the same shape as the cache-overlay bug documented below --
          # two dependency sets unioned into one site-packages, diagnosed there
          # via two pip-*.dist-info dirs. That fix removed `restore-keys`, which
          # closed the cache route into this state and left the concurrency route
          # open. Keying the path closes it structurally: differing dependency
          # sets can no longer name the same directory. Jobs sharing a hash still
          # write concurrently, but they install identical versions, so there is
          # no version to tear.
          echo "$HOME/.venvs/llm-ci-${{ hashFiles('llm-service/requirements.txt') }}/bin" >> "$GITHUB_PATH"
          # One venv per requirements revision would otherwise grow without bound
          # (~450MB each, and Dependabot moves this file most weeks). Drop the
          # stale ones, never the current one -- an untouched dir may still be
          # the live venv of an open PR whose deps have not changed in a while.
          # Not only directories: each venv's `.complete` marker (see the reuse
          # step below) sits next to it and goes stale with it.
          find "$HOME/.venvs" -maxdepth 1 -name 'llm-ci-*' \
            ! -name 'llm-ci-${{ hashFiles('llm-service/requirements.txt') }}' \
            ! -name 'llm-ci-${{ hashFiles('llm-service/requirements.txt') }}.complete' \
            -mtime +14 -print -exec rm -rf {} + 2>/dev/null || true
      # Reuse the venv this runner's disk already holds, and skip the GitHub
      # cache restore below. The venv lives outside the workspace, so on a
      # persistent runner it is normally already here and complete; restoring
      # the cache anyway re-extracted ~450MB of identical bytes over it (31 s
      # per job, measured) -- and over the site-packages of any concurrent job
      # with the same hash that was mid-test at the time.
      #
      # "Complete" is a marker file written only after the venv was restored or
      # fully installed (the "Mark this venv complete" step below). It sits NEXT
      # TO the venv, not inside it, so it never enters the cached tarball. A
      # venv without one -- a job with this hash still installing into it, or
      # an install that died halfway -- takes the cache/install path exactly as
      # before, and the import check catches a venv deleted from under its
      # marker. Deleting a marker sends that venv back through the cache path
      # once; deleting the directory and its marker rebuilds it.
      #
      # Only where a runner persists: a GitHub-hosted runner starts empty, so
      # there it would only ever find nothing.
      - name: Reuse the venv already on this runner's disk
        id: venv-local
        if: env.RUN == '1' && (runner.environment == 'self-hosted')
        run: |
          v="$HOME/.venvs/llm-ci-${{ hashFiles('llm-service/requirements.txt') }}"
          if [ -f "$v.complete" ] && "$v/bin/python" -c 'import pytest' 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $v (complete since $(date -r "$v.complete" '+%Y-%m-%d %H:%M'))"
          else
            echo "No complete venv at $v -- restoring from the cache or installing."
          fi
      # CI SPEEDUP: cache the entire installed venv, not just pip wheels.
      # The old pip-wheel cache still required dep resolution + extraction
      # on every run (~5-7 min). Caching the venv directly reduces to a
      # ~5s restore on cache hit. Key is requirements.txt hash so a dep
      # change correctly busts the cache.
      #
      # DELIBERATELY NO `restore-keys`. `path` is a PERSISTENT directory (it
      # lives outside the workspace so it survives runner cleanup, see the
      # step below), and actions/cache extracts its tarball OVER whatever is
      # already on disk without deleting files absent from the tarball. So a
      # PREFIX match unions two different dependency sets into one
      # site-packages. That is not theoretical: it bricked this lane for every
      # llm-touching PR. #702 changed requirements.txt, so the exact key
      # stopped matching; main's stale entry still prefix-matched; the overlay
      # produced a half-26.1.2 / half-26.2 pip (both pip-*.dist-info dirs, and
      # both `pip/_internal/build_env/` (26.2, a package) and `build_env.py`
      # (26.1.2, a module) — Python resolves the package, whose installer.py
      # imports `get_runnable_pip` from a utils/misc.py that predates it):
      #   ImportError: cannot import name 'get_runnable_pip'
      # The crash happened BEFORE "Post Cache", so the poisoned entry could
      # never be replaced — the failure was self-perpetuating and had to be
      # broken by deleting the cache entry by hand.
      #
      # An exact-key-only cache cannot do this: either the tarball is
      # byte-identical to what the key describes (idempotent overlay) or
      # nothing is restored at all. And prefix-restoring a venv bought nothing
      # anyway — the install step below reinstalls on any miss. An EXACT hit
      # still skips that step and keeps the ~5s restore.
      - name: Cache Python venv
        id: venv-cache
        if: env.RUN == '1' && (steps.venv-local.outputs.ready != 'true')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.venvs/llm-ci-${{ hashFiles('llm-service/requirements.txt') }}
          key: ${{ runner.os }}-venv-llm-${{ hashFiles('llm-service/requirements.txt') }}
      - name: Install dependencies
        if: env.RUN == '1' && (steps.venv-local.outputs.ready != 'true' && steps.venv-cache.outputs.cache-hit != 'true')
        working-directory: llm-service
        run: |
          PY=python3
          # Venv lives in a stable path outside the workspace so it survives
          # runner cleanup between jobs. Activating is just adding bin/ to PATH.
          #
          # Still NOT `venv --clear`: a job sharing this hash may be installing
          # into this same directory right now, and --clear would delete
          # site-packages out from under it (a real scenario here — Dependabot
          # lands PRs in large batches). The reason it is now merely unnecessary
          # rather than a compromise is the hash in the path: a cache miss can
          # only reuse a directory built from THIS requirements.txt, so the
          # "package dropped from requirements.txt lingers" wart is gone too --
          # dropping a package changes the hash, which names a new directory.
          $PY -m venv "$HOME/.venvs/llm-ci-${{ hashFiles('llm-service/requirements.txt') }}"
          # Always `python -m pip`, never the bin/pip console script. `venv`
          # over an existing dir rewrites bin/ but leaves site-packages, so the
          # shim and the installed pip library can skew — and a skewed shim
          # cannot even run to repair itself (that is the failure above). The
          # module form resolves whichever pip is actually installed.
          VPY="$HOME/.venvs/llm-ci-${{ hashFiles('llm-service/requirements.txt') }}/bin/python"
          "$VPY" -m pip install --upgrade pip
          "$VPY" -m pip install -r requirements.txt
          "$VPY" -m pip install pytest pytest-asyncio
      - name: Mark this venv complete
        if: env.RUN == '1' && (runner.environment == 'self-hosted' && steps.venv-local.outputs.ready != 'true')
        run: touch "$HOME/.venvs/llm-ci-${{ hashFiles('llm-service/requirements.txt') }}.complete"
      - name: Install connector test drivers
        if: env.RUN == '1'
        # Test-only DB drivers NOT in llm-service/requirements.txt — each connector ships
        # its own driver in its own image and llm-service never imports them, so they don't
        # belong in requirements.txt. Only the per-connector offline suites (added below)
        # need them at COLLECTION time, e.g. mongodb's test does `from bson import ObjectId`
        # (bson ships with pymongo). NOT cache-gated (unlike "Install dependencies" above),
        # because a venv cache HIT would otherwise skip the install; pip no-ops when already
        # satisfied. Extend this list when a newly-gated connector needs a collection-time driver.
        #
        # setuptools<81 is not a driver: opentelemetry-instrumentation==0.46b0 (pinned in
        # requirements.txt) imports pkg_resources at module scope, and setuptools>=81 no
        # longer ships it. The runtime image (python:3.11-slim) still bundles an older
        # setuptools, so this is a CI-only divergence — without the pin, tests/ fails at
        # COLLECTION with ModuleNotFoundError: pkg_resources, not at runtime in prod.
        #
        # pytest-xdist is not a driver either: it runs invocation (2) of "Run unit
        # tests" on 4 workers. Installed here, not in "Install dependencies", for the
        # same reason as the drivers -- a venv cache HIT skips that step.
        run: pip install pymongo 'setuptools<81' 'pytest-xdist>=3.8'
      # Eight cases across six suites are `skipif(shutil.which("helm") is None)`.
      # They render the chart: the documented `helm install` blocks, the four
      # cloud overlays, the external-Postgres TLS wiring, the docker-host
      # feature gates, and what `helm package` actually ships. A skip is
      # silent -- pytest prints one summary line whether a case ran or not.
      #
      # NOTHING in this repo installs helm by default, and this job runs on
      # ubuntu-latest, whose image makes no promise to carry one. Comments in
      # those suites used to assert the opposite -- "CI has NO helm binary" --
      # and used it to justify staying text-only, which was the wrong argument
      # for a decision that was right anyway: a text parse needs no binary.
      #
      # So arrange the dependency once, here, where a runner without helm is a
      # red job instead of eight quiet skips. Same action and same pin as
      # docker-publish.yml already uses for publish-chart, and the version
      # print after it turns a broken setup into a named failure rather than a
      # later skip. Gated like every step after the RUN decision: an ungated
      # setup step runs on PRs the job has nothing to do for
      # (test_ci_inline_change_filters.py).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: env.RUN == '1'
      - name: helm is present (eight chart cases skip silently without it)
        if: env.RUN == '1'
        run: helm version --short
      - name: Run unit tests
        if: env.RUN == '1'
        working-directory: llm-service
        env:
          PYTHONPATH: ${{ github.workspace }}/llm-service:${{ github.workspace }}/llm-service/src:${{ github.workspace }}/shared/mcp-connectors
          # Importing the gateway calls telemetry.init_tracer(), which has no env
          # kill-switch of its own, so the OTLP exporter starts and then retries a
          # gRPC connect to localhost:4317 on every span+shutdown. Nothing listens in
          # CI, so that is ~250 lines of "Connection refused" per run, burying real
          # failures in the log. This is the SDK's own standard opt-out (read by
          # opentelemetry-sdk, not by our code) — no product code changes for it.
          OTEL_SDK_DISABLED: "true"
        run: |
          # TODO(qa): re-enable test_deserialize_wire_format once it's reconciled
          # with the current AvroSerializer (JSON fallback now requires AVRO_ALLOW_JSON_PAYLOAD).
          #
          # test_generated_connectors.py and test_connector_resolver.py live at
          # llm-service/ root (not under tests/) but are pure unit tests against
          # every generated MCP connector — explicitly included here.
          #
          # src/agents/tool_generator/tests/ and src/agents/planner/test_*.py live
          # inside source dirs (next to the modules they test) — also pure unit
          # tests with no infra deps. Several files are excluded below: some have
          # collection errors against the current code, others have known-bad
          # test bodies. Tracked in tests/DORMANT_TESTS_TO_FIX.md so they get
          # picked up later instead of staying invisibly broken.
          # test_suggestions_schema_detect.py is a pure in-process unit suite that
          # lived in tests/ but was never collected (the lane enumerates paths by
          # name rather than globbing tests/) — added here so it actually runs.
          # test_connector_auth_contract.py is the canonical auth-contract gate
          # (auth_type enum + auth_type!=none ⟹ supported_auth_methods non-empty +
          # oauth2 methods resolve a registered provider). It was written to be
          # enforced but, like the suite above, was never in the enumerated lane —
          # added here so connector auth-metadata drift becomes un-mergeable.
          # test_staged_upsert_write_count.py guards base_connector.staged_upsert's
          # write-count contract (return the driver's rowcount, clamped to the input
          # batch size — MySQL's ON DUPLICATE KEY UPDATE reports 2 per updated row).
          # Same story as the two above: it lives in tests/ but the lane enumerates
          # by name, so it had to be listed to run at all.
          #
          # ../shared/mcp-connectors/tests/ is passed as a DIRECTORY, not as the
          # single test_discovery_contract.py it used to name. That file was the
          # only one of the eleven in there that any CI lane ran: the per-connector
          # lane below globs `public/**/versions/*/test_*.py`, which this shared
          # dir is not under, so the other ten — 72 tests including the SSRF
          # redirect guard and the LLM log-scrubbing contract — were dead weight in
          # the repo. Same enumerate-by-name bug as the three files above, one
          # directory over; globbing the dir also auto-gates new files instead of
          # requiring this list to be edited (which is how they got missed).
          #
          # The tests/ list above is now a DIRECTORY glob, for the same reason the
          # shared dir is: new files under llm-service/tests/ gate themselves instead
          # of waiting for someone to remember to edit a list. Doing that picked up 19
          # files / 110 tests that had never run in CI once — among them the LLM
          # error-scrubber parity contract (test_scrubber_parity.py,
          # test_masking_scrub.py, test_suggestions_pii_type_guard.py) and twelve
          # connector-generation regression suites (test_gen_*.py).
          #
          # It has to be TWO pytest invocations, and the split is load-bearing.
          # tests/unit and the rest of tests/ cannot share one process: two different
          # packages claim the top-level name `schemas` (shared/mcp-connectors/schemas
          # and src/agents/tool_generator/schemas) and two claim `agents`
          # (src/agents and src/agents/tool_generator/agents). Whichever test imports
          # first binds the name for the whole process, because
          # src/agents/tool_generator/agents/researcher.py:32 does a bare
          # sys.path.insert(0, <tool_generator dir>) at import time. Listing
          # `tests/unit` ahead of `tests/` does NOT fix the order — pytest collapses
          # the child arg into the parent and walks it alphabetically, so
          # test_staged_upsert_write_count.py binds `schemas` to the shared package
          # long before tests/unit is reached. Separate processes = separate
          # sys.modules, which is the only thing that actually separates them.
          # If you add a file under tests/ that needs the other convention and CI goes
          # red on a `schemas`/`agents` import, move it under tests/unit — do not go
          # back to enumerating by name.

          # (1) src/agents world: tests/unit plus the tool_generator suites.
          #
          # The tool_generator half is assembled into $TG_ARGS instead of being written
          # inline, and the conditional is not defensive habit -- it is the difference
          # between a green first public CI run and a red one.
          # src/agents/tool_generator/tests is on llm-service/oss-strip-list.txt, so the
          # PUBLIC repo does not have that directory. pytest treats a missing PATH
          # ARGUMENT as a usage error, not as "nothing to collect": exit code 4,
          # `ERROR: file or directory not found`, and NOTHING in the invocation runs --
          # tests/unit and src/agents/planner/ go down with it. A `--ignore=` naming a
          # path that does not exist is harmless by contrast (exit 0), which is why the
          # ignores can sit inside the same variable without their own guard.
          #
          # Deliberately NOT conditional: tests/unit, the two root test files, and
          # src/agents/planner/. Dockerfile.community COPYs planner, so it survives the
          # cut; if any of them ever goes missing that is a real defect and this job
          # should stay loud about it.
          TG_DIR=src/agents/tool_generator/tests

          # The dormant suites, described in the header comment above. Full paths on
          # purpose -- a grep for one of these files has to find it here.
          TG_IGNORES="
            --ignore=src/agents/tool_generator/tests/test_builder.py
            --ignore=src/agents/tool_generator/tests/test_context7_capability_validation.py
            --ignore=src/agents/tool_generator/tests/test_mock_server.py
            --ignore=src/agents/tool_generator/tests/test_qa_auth_e2e.py
            --ignore=src/agents/tool_generator/tests/test_qa_feedback_enricher.py
            --ignore=src/agents/tool_generator/tests/test_qa_mcp_protocol.py
            --ignore=src/agents/tool_generator/tests/test_validate_context7_threshold.py
            --ignore=src/agents/tool_generator/tests/test_architect_graphql_phase_5.py
            --ignore=src/agents/tool_generator/tests/test_e2e_pipeline_phase_13e.py
            --ignore=src/agents/tool_generator/tests/test_end_to_end_review.py
            --ignore=src/agents/tool_generator/tests/test_harness_matrix.py
            --ignore=src/agents/tool_generator/tests/test_oauth_flow_capture_integration.py
            --ignore=src/agents/tool_generator/tests/test_eval_phase_9.py
            --ignore=src/agents/tool_generator/tests/test_graphql_mock_and_validator_phase_7.py
            --ignore=src/agents/tool_generator/tests/test_graphql_template_phase_6.py
            --ignore=src/agents/tool_generator/tests/test_multi_auth_phase_12.py
            --ignore=src/agents/tool_generator/tests/test_auth_preset_nonbearer.py
            --ignore=src/agents/tool_generator/tests/test_parity_phase_13f.py
            --ignore=src/agents/tool_generator/tests/test_preflight_phase_13d.py
            --ignore=src/agents/tool_generator/tests/test_session_handoff_phase_13a.py
            --ignore=src/agents/tool_generator/tests/test_discovery_phase_0a.py
            --ignore=src/agents/tool_generator/tests/test_probe_pipeline_phase_4.py
            --ignore=src/agents/tool_generator/tests/test_vendor_registry_phase_0b.py
            --ignore=src/agents/tool_generator/tests/test_oauth_provider_linkage.py
          "

          TG_ARGS=""
          if [ -d "$TG_DIR" ]; then
            TG_ARGS="$TG_DIR/ $TG_IGNORES"
          else
            # Printed, not silent. "The suites were stripped" and "the suites vanished"
            # look identical from the summary line, and this repo has been bitten by
            # exactly that difference before.
            echo "NOTE: $TG_DIR is absent -- stripped by llm-service/oss-strip-list.txt."
            echo "      The tool_generator suites are not part of this tree; everything"
            echo "      else in this invocation still runs."
          fi

          # $TG_ARGS is intentionally unquoted: it is a word list, and no path in it
          # contains a space. Empty expands to nothing, which is the public-repo case.
          pytest tests/unit \
            test_generated_connectors.py test_connector_resolver.py \
            src/agents/planner/ \
            $TG_ARGS \
            -k "not test_deserialize_wire_format" \
            -v

          # (2) app + shared-connector world: everything else under tests/, globbed.
          # Nothing under tests/ is ignored any more. test_explorer_endpoints.py used
          # to be the one file that genuinely could not run here — it issued real
          # openai /chat/completions calls, so 13 of its 15 tests failed on connection
          # error without a live LLM backend. It now stubs both module-level clients
          # (explorer_api.explorer_client, gateway_main.sql_client) in an autouse
          # fixture, so it is offline-clean and gated like everything else.
          #
          # -n 4: this invocation is ~11,400 tests and took 533 s serially (run
          # 36317140151), the longest step on the PR path. On 4 xdist workers it
          # ran in 94-123 s across four local runs, collecting the same 11,395
          # tests. Four, not auto: four runners share this Mac's 11 cores. Invocation (1)
          # stays serial -- 46 s, and the tool_generator suites were never proven
          # worker-safe.
          pytest tests/ \
            --ignore=tests/unit \
            ../shared/mcp-connectors/tests/ \
            -n 4 \
            -v
      - name: Per-connector regression tests (offline suites)
        if: env.RUN == '1'
        # The offline unit suites that ship next to each connector under
        # public/**/versions/<v>/test_*.py — fail-loud-on-truncation, decimal scale
        # fidelity, multi-schema discovery, type canonicalization, INV-1 storage
        # isolation, GraphQL pagination — were in NO CI lane, so regressions went
        # SILENTLY red: the GPLv2->MIT pymysql swap (#499) narrowed a fail-loud sql_mode
        # guard and broke mysql's test_upsert_strict_failloud for months unnoticed; two
        # sqlserver assertions drifted stale behind the #527/#530 type-fidelity fixes; and
        # aws-s3's INV-1 export test made a live network call (endpoint_url in the wrong
        # place). This gate runs them all so that class of drift becomes un-mergeable.
        #
        # Each connector dir runs in its OWN pytest process: every connector ships a module
        # literally named `connector.py` (imported via sys.path.insert at the top of each
        # test), and several test files share a basename across connectors
        # (test_multi_schema_discovery.py, test_decimal_scale_preservation.py). A single
        # process would collide on sys.modules['connector'] (first import wins) and on
        # duplicate basenames — per-dir subprocesses give each a clean module table.
        #
        # Scope = every connector offline suite under BOTH connector trees:
        # public/**/versions/<v>/ (DB family, storage, GraphQL, redshift, sample-data) and
        # internal/**/versions/<v>/ (debezium). New connectors are auto-gated: keep the
        # suite offline (no network) and add any collection-time driver to the step above.
        #
        # `internal` was missing from this find for as long as the step has existed, so the
        # five debezium suites — publication.autocreate.mode, secret externalization, log
        # redaction, topic naming, schema-history TLS — ran in NO lane at all. They are
        # 38 offline tests that finish in under a tenth of a second; the only reason they
        # were unguarded is that the glob named one directory instead of two. The floors
        # below are per-tree for exactly that reason: a single total would have stayed
        # comfortably above any threshold while one whole tree contributed zero.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/llm-service:${{ github.workspace }}/llm-service/src:${{ github.workspace }}/shared/mcp-connectors
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          fail=0
          # Two plain counters rather than one associative array: `shell: bash` resolves to
          # whatever bash is first on PATH. That is bash 5 on ubuntu-latest, but it was the
          # system 3.2 on the macOS runners this ran on, and 3.2 has no `declare -A`. Kept
          # portable: a gate that dies on its own syntax is a worse outcome than a slightly
          # longer script.
          count_public=0
          count_internal=0
          run_tree() {
            tree="$1"
            n=0
            while IFS= read -r d; do
              n=$((n + 1))
              echo "::group::pytest $d"
              ( cd "$d" && pytest -q --no-header -p no:cacheprovider ) || fail=1
              echo "::endgroup::"
            done < <(find "shared/mcp-connectors/$tree" \
                          \( -name venv -o -name .venv -o -name node_modules \
                             -o -name site-packages -o -name __pycache__ \) -prune -o \
                          -path '*/versions/*/test_*.py' -exec dirname {} \; | sort -u)
            # `fail` is set inside the while body, which runs in THIS shell (process
            # substitution, not a pipe) -- so the assignment survives. Do not turn the
            # `done < <(...)` back into `find ... | while`, which would run the body in a
            # subshell and throw away every failure.
            #
            # The -prune matters even though the pruned dirs are all gitignored: a dev who
            # has ever run a connector locally has a venv/ under versions/<v>/, and without
            # it this find descends into site-packages and cheerfully runs setuptools' OWN
            # test suite (7 extra "connector dirs", ~55 errors). CI never saw it because
            # the venv is untracked -- which is exactly what makes the count untrustworthy
            # as a floor: it differs between the runner and every laptop.
            eval "count_$tree=$n"
          }
          run_tree public
          run_tree internal
          echo "ran per-connector regression suites: public=$count_public internal=$count_internal; aggregate_fail=$fail"
          # A gate that runs ZERO tests must NOT report success: an empty set reads
          # exactly like a pass, and no downstream reader can tell the two apart.
          # Checked per tree, not on the sum: `internal` currently contributes 1 dir out of
          # 23, so a total-only floor would still pass with the entire internal tree silently
          # dropped -- which is precisely the failure this step shipped with.
          for tree in public internal; do
            eval "n=\$count_$tree"
            if [ "$n" -eq 0 ]; then
              echo "ERROR: no per-connector test dirs matched under shared/mcp-connectors/$tree" >&2
              echo "       Either the connector layout drifted, or that tree lost its suites." >&2
              fail=1
            fi
          done
          exit "$fail"

  e2e-support-unit:
    name: e2e/_support unit tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Change detection, inlined -- see "Why there is no `changes` job" above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/paths-filters.yml
      # RUN is this job's only gate. EVERY step below carries `if: env.RUN == '1'`,
      # and llm-service/tests/test_ci_inline_change_filters.py fails if one does not:
      # an unguarded step would work on a PR that changed none of this job's paths,
      # and a step wrongly left outside the gate would report green having done
      # nothing -- KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW, same class.
      - name: Does this job have anything to do?
        env:
          WANTED: ${{ steps.filter.outputs.e2e == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$WANTED" = 'true' ]; then
            echo 'RUN=1' >> "$GITHUB_ENV"
          else
            echo 'RUN=0' >> "$GITHUB_ENV"
            echo '::notice title=e2e/_support unit tests skipped::no path this job filters on changed'
            echo '`e2e/_support unit tests` -- skipped: no path this job filters on changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.RUN == '1'
        with:
          python-version: '3.11'
      - name: Set up Python 3.11 venv
        if: env.RUN == '1'
        run: |
          PY=python3
          $PY --version
          $PY -m venv "$GITHUB_WORKSPACE/.venv-e2e"
          "$GITHUB_WORKSPACE/.venv-e2e/bin/python" -m pip install --upgrade pip
          echo "$GITHUB_WORKSPACE/.venv-e2e/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        if: env.RUN == '1'
        run: pip install pytest requests
      - name: Run unit tests for e2e helpers
        if: env.RUN == '1'
        run: pytest e2e/_support -v

  # OSS connector-lifecycle DEPLOY smoke — the runtime guard for the F1 class.
  #
  # The OSS image (llm-service/Dockerfile.oss, served by src.lifecycle.main) can import
  # cleanly yet still be dead-on-arrival: docker_builder.py is fully gated on the `docker`
  # Python SDK, so if `docker>=7.0.0` is missing from requirements-oss.txt every /v1/deploy
  # returns "Docker not available" (the F1 bug PR #500 fixed). scripts/oss-leak-proof-test.sh
  # only checks import + buildx PRESENCE — it never POSTs /v1/deploy, so it is green-but-blind
  # over that path. This job stands up ONLY the lifecycle container in isolation (its own
  # throwaway network/volume/container — never the shared rsync-ai / rsync-ai-mcp stack) and
  # drives a REAL /v1/deploy of a lightweight connector to a running container. Its negative
  # control: drop docker>=7.0.0, rebuild, and this smoke fails with "Docker not available".
  #
  # workflow_dispatch + nightly schedule ONLY — NEVER per-PR: it builds the OSS image AND
  # JIT-builds+deploys a connector through the host docker daemon (~10-15 min, collision-prone
  # on shared fixed names/ports), too heavy for the PR critical path. A regression here is
  # still caught within 24h by the nightly cron (same cron as the a11y / data-pipeline gates).
  oss-deploy-smoke:
    name: OSS connector-lifecycle deploy smoke
    # `github.repository ==` is an AVAILABILITY guard, not a fork guard: it skips runs
    # happening inside someone's own fork, which has no reason to run this repo's nightly
    # deploy smoke against its own docker daemon -- and, while the job was self-hosted, had
    # no runner to run it on at all. On a fork PR against THIS repo it names the base repo
    # and evaluates TRUE, so it never blocked fork-authored code. The head-repo predicate
    # conjoined below is the fork guard; the control that actually holds is the repo
    # setting "Require approval for all external contributors", because a pull_request run
    # executes the workflow from the PR head.
    #
    # The list, rather than one slug: the public repo is `rsync-ai/rsync.ai` and the
    # private one keeps its own name and stays alive after the flip, so CI has to
    # run on BOTH. Naming only one silently disables this job on the other -- a
    # skipped job is indistinguishable from a passing one, which is the whole
    # reason test_repo_slug_is_publishable.py asserts the guard admits the repo
    # this checkout actually points at.
    if: ${{ (contains(fromJSON('["rsync-ai/rsync-ai", "rsync-ai/rsync.ai"]'), github.repository) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # Serialize: the smoke uses fixed isolated resource names (rsync-oss-smoke-*) and a fixed
    # host port, so two concurrent runs would clobber each other. Queue (don't cancel) so an
    # in-flight run tears its resources down cleanly rather than dying mid-deploy.
    concurrency:
      group: oss-deploy-smoke
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy a connector through the OSS lifecycle image (real /v1/deploy)
        run: |
          chmod +x scripts/oss-deploy-smoke.sh
          bash scripts/oss-deploy-smoke.sh

  # OSS moat-leak proof — builds BOTH published llm-service images and proves
  # neither carries the connector-generation moat.
  #
  # This job did not exist. scripts/oss-leak-proof-test.sh was referenced in the
  # comment above and in INVENTORY.md, and run by hand, but no workflow invoked
  # it -- so the proof standing between the private moat and a public image had
  # never run in CI even once. No check fails for a step that does not exist,
  # which is why "the leak test is green" was never a claim anyone could check.
  # It matters now specifically: the moat becomes irreversibly public the moment
  # a leaked layer is pushed, and unlike a bug that cannot be fixed forward.
  #
  # Unlike oss-deploy-smoke (schedule/dispatch only), this is cheap enough for the
  # PR path: it builds two images against a warm layer cache and runs short-lived
  # containers. It JIT-builds no connector, binds no host port and touches no
  # shared stack, so it does not need that job's serialization for correctness --
  # the concurrency group below exists only because the image TAGS are fixed.
  #
  # test_oss_image_boundary.py already reasons about both Dockerfiles, but it
  # reasons about COPY *lines*. It cannot see what a pip install, a base-layer
  # file or a transitive copy actually leaves on disk. This job is the half that
  # inspects the built artifact.
  oss-leak-proof:
    name: OSS images are moat-free
    # Guard to the canonical repo: a fork or mirror has no business running this
    # repo's moat proof against its own docker daemon.
    #
    # Both halves are load-bearing. `github.repository ==` blocks a mirror's own
    # scheduled run, but on a fork PULL REQUEST it names the BASE repo and evaluates
    # TRUE -- which is how fork-authored code would have reached the self-hosted Macs
    # that held the prod deploy key, while this job still ran on them. The head-repo
    # comparison is the half that actually stops that, and it is the one
    # llm-service/tests/test_self_hosted_jobs_are_fork_guarded.py requires on every
    # self-hosted job reachable from a fork PR. It has no such job to require it of
    # in this tree, which is the reason to keep the test rather than delete it with
    # them: it is what goes red if one comes back.
    #
    # Both slugs, for the reason spelled out on oss-deploy-smoke above: this job
    # must keep running on the private repo before the flip and on the public one
    # after it.
    if: ${{ contains(fromJSON('["rsync-ai/rsync-ai", "rsync-ai/rsync.ai"]'), github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # NO job-level `concurrency` here, deliberately. There used to be one -- a
    # repository-wide group `oss-leak-proof` with `cancel-in-progress: false` --
    # whose only stated job was to stop two runs overwriting the fixed image tags
    # rsync-oss-leaktest:{community,lifecycle}. A concurrency group holds exactly
    # ONE pending entry, so with several PRs in flight each newly queued run
    # CANCELLED the one waiting ahead of it. The guard then did not execute at all,
    # and the PR showed a red X that reads exactly like a real moat leak. Measured
    # over 60 ci.yml runs: 12 of this job's 53 non-skipped runs ended `cancelled`
    # with ZERO steps -- the tell, since a run that really executes has 6 steps and
    # takes 19-47s. The collision it was protecting against is fixed properly below,
    # by making the tags unique per run; two 20s cache-warm builds on this box cost
    # nothing, so there is no second reason to serialize.
    #
    # llm-service/tests/test_moat_job_is_not_serialized_by_a_shared_tag.py holds
    # this shape: the env below, the script reading it, and the absence of a
    # constant-named group on any PR-reachable job.
    env:
      # run_id alone would collide across re-runs of the same run; run_attempt
      # separates those. Both are plain digits, so the result is a legal tag.
      LEAKTEST_TAG_SUFFIX: -${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Change detection, inlined -- see "Why there is no `changes` job" above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/paths-filters.yml
      # RUN is this job's only gate. EVERY step below carries `if: env.RUN == '1'`,
      # and llm-service/tests/test_ci_inline_change_filters.py fails if one does not:
      # an unguarded step would work on a PR that changed none of this job's paths,
      # and a step wrongly left outside the gate would report green having done
      # nothing -- KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW, same class.
      # `oss`, not `llm`: see that filter in .github/paths-filters.yml.
      - name: Does this job have anything to do?
        env:
          WANTED: ${{ steps.filter.outputs.oss == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$WANTED" = 'true' ]; then
            echo 'RUN=1' >> "$GITHUB_ENV"
          else
            echo 'RUN=0' >> "$GITHUB_ENV"
            echo '::notice title=OSS images are moat-free skipped::no path this job filters on changed'
            echo '`OSS images are moat-free` -- skipped: no path this job filters on changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Both published OSS images carry none of the moat
        if: env.RUN == '1'
        run: |
          chmod +x scripts/oss-leak-proof-test.sh
          bash scripts/oss-leak-proof-test.sh
      - name: Remove the leak-test images
        if: env.RUN == '1' && (always())
        # The runner is a long-lived box; two ~1GB images per run would accumulate.
        # Never fail the job on cleanup -- a red X here would be read as a leak.
        #
        # Scoped to THIS run's tags. Removing the bare `:community` / `:lifecycle`
        # names here was the second collision the mutex was masking: with unique
        # tags but a fixed cleanup, run A's teardown would untag run B's image
        # mid-scan.
        #
        # The obvious worry about `rmi -f` is the opposite one -- that it deletes a
        # shared image out from under a concurrent scan -- so this was measured on
        # the runner daemon rather than reasoned about. It is safe by two
        # independent routes: two builds of one UNCHANGED context are assigned
        # different image ids (so concurrent runs do not share an image at all),
        # and even when two tags do point at one id, `docker rmi -f <tag>` only
        # untags that reference -- the other tag survives and stays inspectable.
        # The first route is why the earlier version of this comment, which
        # asserted that concurrent builds share an id, was wrong about the
        # mechanism while right about the conclusion.
        run: |
          docker rmi -f "rsync-oss-leaktest:community${LEAKTEST_TAG_SUFFIX}" \
                        "rsync-oss-leaktest:lifecycle${LEAKTEST_TAG_SUFFIX}" || true

  frontend:
    name: Frontend (lint + test + build)
    # Runs on frontend PRs AND on the nightly schedule (the a11y job below
    # needs this job's build output, so the build must run nightly too).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Change detection, inlined -- see "Why there is no `changes` job" above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/paths-filters.yml
      # RUN is this job's only gate. EVERY step below carries `if: env.RUN == '1'`,
      # and llm-service/tests/test_ci_inline_change_filters.py fails if one does not:
      # an unguarded step would work on a PR that changed none of this job's paths,
      # and a step wrongly left outside the gate would report green having done
      # nothing -- KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW, same class.
      - name: Does this job have anything to do?
        env:
          WANTED: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$WANTED" = 'true' ]; then
            echo 'RUN=1' >> "$GITHUB_ENV"
          else
            echo 'RUN=0' >> "$GITHUB_ENV"
            echo '::notice title=Frontend skipped::no path this job filters on changed'
            echo '`Frontend` -- skipped: no path this job filters on changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.RUN == '1'
        with:
          # MUST equal the major in frontend/Dockerfile (node:26-alpine in all
          # three stages) — CI is only a gate on what we ship if it runs the
          # same major. That is not self-enforcing and it already broke once:
          # #902 bumped the image 24 -> 26 for the CVE count, and this pin, the
          # four cache-key literals below, and @types/node all stayed on 24. For
          # ~a day CI lint/test/build ran 24 while the image ran 26, so anything
          # that only breaks on 26 would have shipped green. Six literals move
          # together, four of them cache keys with the major glued into the
          # string — so grep for the outgoing major's VALUE, not for a variable
          # name. Deliberately not spelled out here: a retired version sitting
          # in a comment is one a reader can paste back in, and it would go
          # stale at the next bump anyway.
          #
          # There is also a floor, unrelated to the image: jsdom 29 pulls
          # undici 7, whose cachestorage.js calls worker_threads.markAsUncloneable
          # at import time. That API does not exist in Node 20 (verified
          # undefined on 20.20.2, the version this runner resolves '20' to), so
          # every one of the 50 test files died at worker startup. undici's own
          # `engines: >=20.18.1` is optimistic and does not catch it.
          node-version: '26'
          # NO `cache: npm`. We cache frontend/node_modules directly below, so
          # on a hit `npm ci` is skipped and ~/.npm is never read at all --
          # setup-node's cache would be ferrying a tree to serve a step that
          # mostly does not run.
          #
          # On the self-hosted Macs it was worse than redundant: that tree had
          # bloated to ~940 MB, and it persisted on local disk anyway, so a miss
          # still found a warm download cache and the upload bought nothing.
          # Same rationale, and the same not-yet, as the Go jobs above -- an
          # ephemeral runner pays a full cold download on a miss, which is a
          # case for measuring rather than a reason this must stay absent.
      # CI SPEEDUP: cache the installed `frontend/node_modules` tree.
      # Caching node_modules directly + a hash on package-lock.json
      # cuts install to a few seconds on cache hit.
      #
      # GitHub-hosted runners only. On a self-hosted runner this restore took
      # ~49 s at the cache backend's 1-6 MB/s, while `npm ci` from the ~/.npm
      # already on that runner's disk takes ~11 s (both measured 2026-09-18),
      # so there the step is skipped and the install below always runs.
      - name: Cache node_modules
        id: nm-cache
        if: env.RUN == '1' && (runner.environment != 'self-hosted')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/node_modules
          # Node major is IN the key: the two jobs share this cache, and a
          # tree installed under one major must never be restored into another
          # (platform/ABI-specific binaries: esbuild, @swc, lightningcss). The
          # restore-keys prefix carries it too, else the old Node 20 caches
          # would be restored by prefix match and defeat the point.
          key: ${{ runner.os }}-node26-nm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node26-nm-
      - name: Install dependencies
        if: env.RUN == '1' && (steps.nm-cache.outputs.cache-hit != 'true')
        working-directory: frontend
        run: npm ci
      # Vitest ran nowhere in CI until 2026-07-30 — `npm test` was not invoked by
      # any of the four workflow files, so all 50 test files under
      # frontend/src/__tests__ were local-only and a green "Frontend" check meant
      # "compiles + lints", never "tests pass". Placed BEFORE the build: a failed
      # assertion should not cost the 60-90s Next build first.
      - name: Unit tests (vitest)
        if: env.RUN == '1'
        working-directory: frontend
        run: npm test
      # CI SPEEDUP: cache Next.js incremental build output (.next/cache).
      # Next.js 13+ persists per-page/per-chunk RSC and webpack caches here.
      # On a PR that only touches a few files this cuts the build from ~4-6
      # min to ~60-90s. Key includes package-lock so a dep bump forces a
      # cold build (new JS bundles). runner.os is implicit in the runner
      # label but explicit here for clarity.
      #
      # Keyed on the lockfile ONLY (2026-09-18). The key also carried a hash of
      # every frontend/src .ts/.tsx file, so nearly every run missed the primary
      # key and the post-job step uploaded a fresh copy of the cache: `Post Cache
      # Next.js build cache` took a median 206 s (max 550 s) over the 16 runs
      # measured, against a 37 s restore. A primary-key hit skips that upload,
      # so now it is saved once per lockfile per branch scope. The cost: the
      # restored cache ages as src changes until the next lockfile bump, and
      # Next.js rebuilds whatever it no longer matches -- still warm, never wrong.
      #
      # GitHub-hosted runners only. A self-hosted runner keeps its own copy on
      # its own disk instead -- the next step and the "Keep" step after the
      # build. Measured 2026-09-18: this restore took 31-40 s and its upload
      # 256 s, for a cache an APFS clone copies in 0.01 s; a warm build takes
      # 9 s against 36 s cold.
      - name: Cache Next.js build cache
        if: env.RUN == '1' && (runner.environment != 'self-hosted')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      # What a self-hosted runner does instead of the step above: restore the
      # last successful build's .next/cache, kept under
      # ~/.cache/rsync-ci/<runner name>/.
      # Per runner, because runner installs on one host can share a $HOME, and
      # two jobs building at once must never write the same directory; one
      # runner runs one job at a time. `cp -c` clones on APFS, so the copy is
      # free whatever its size. A missing or failed copy only means a cold
      # build, so neither this step nor the Keep step can fail the job.
      - name: Restore Next.js build cache (this runner's disk)
        if: env.RUN == '1' && (runner.environment == 'self-hosted')
        continue-on-error: true
        run: |
          d="$HOME/.cache/rsync-ci/$RUNNER_NAME/nextjs"
          if [ ! -d "$d" ]; then
            echo "No Next.js cache on this runner yet; building cold."
            exit 0
          fi
          mkdir -p frontend/.next
          rm -rf frontend/.next/cache
          if cp -cR "$d" frontend/.next/cache; then
            echo "Restored $(du -sm frontend/.next/cache | cut -f1) MB from $d"
          else
            rm -rf frontend/.next/cache
            echo "::warning title=Next.js cache::copy from $d failed; building cold"
          fi
      # CI SPEEDUP: run lint in the background while Next.js build compiles.
      # Lint is CPU-light (ESLint pass) and finishes well before the build.
      # Both must succeed; if lint fails its exit code surfaces at `wait`.
      - name: Lint + Build (parallel)
        if: env.RUN == '1'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_PUBLIC_WS_URL: ws://localhost:5001/ws
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run lint &
          LINT_PID=$!
          npm run build
          wait $LINT_PID
      # Keep this build's .next/cache for the next job on this runner: only
      # after a successful build, and through a temp dir + rename so the kept
      # copy is never a partial one. Capped at 2 GB -- past that it is dropped,
      # and the next build starts cold and small again.
      - name: Keep Next.js build cache (this runner's disk)
        if: env.RUN == '1' && (runner.environment == 'self-hosted')
        continue-on-error: true
        run: |
          d="$HOME/.cache/rsync-ci/$RUNNER_NAME/nextjs"
          src=frontend/.next/cache
          if [ ! -d "$src" ]; then
            echo "The build left no .next/cache; nothing to keep."
            exit 0
          fi
          mb=$(du -sm "$src" | cut -f1)
          if [ "$mb" -gt 2048 ]; then
            echo "::warning title=Next.js cache::.next/cache is ${mb} MB (over 2048); dropping this runner's copy"
            rm -rf "$d"
            exit 0
          fi
          mkdir -p "$(dirname "$d")"
          rm -rf "$d.new"
          if cp -cR "$src" "$d.new"; then
            rm -rf "$d"
            mv "$d.new" "$d"
            echo "Kept ${mb} MB at $d"
          else
            rm -rf "$d.new"
            echo "::warning title=Next.js cache::copy to $d failed; the next build on this runner starts cold"
          fi
      - name: Archive build output
        # Only the frontend-a11y job consumes this archive, and it runs
        # nightly/manual only (schedule || workflow_dispatch), so the archive and
        # the hand-off below are gated to the SAME condition.
        if: env.RUN == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        # One archive, not the tree: Next.js 16 emits chunk files whose names
        # contain ':' (e.g. `[externals]_node:inspector_*.js`). `.next/cache`
        # is left out -- `next start` never reads it, and it is the ~400 MB this
        # runner already keeps on its own disk (the step above).
        working-directory: frontend
        run: tar -cf frontend-build.tar --exclude .next/cache .next public
      - name: Hand the build to frontend-a11y (actions cache, not an artifact)
        # Through the ACTIONS CACHE, not upload-artifact. The account's artifact
        # storage quota is exhausted (no artifact has landed since 2026-08-23), and
        # an exhausted quota failed THIS step -- which turned the nightly's
        # Frontend job red on a build that had passed, and skipped a11y. The cache
        # is a separate 10 GB per-repo budget; an entry nobody restores is evicted
        # after 7 days. test_no_job_depends_on_the_artifact_quota.py holds the class.
        if: env.RUN == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/frontend-build.tar
          key: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}

  frontend-a11y:
    name: Frontend a11y (axe-core)
    needs: frontend
    # Nightly / manual only — NOT on PRs, and it MEASURES LESS THAN IT LOOKS.
    #
    # This job brings up only the Next frontend (playwright.a11y.config.ts
    # `webServer` = `PORT=3100 npm run start`). It starts NO api-gateway, so
    # e2e/fixtures/auth.setup.ts fails its `${API_URL}/health` probe and calls
    # `setup.skip(...)`, and e2e/a11y/authenticated_pages.spec.ts then self-skips
    # all four authenticated routes on the missing `.auth/user.json`. A skip is
    # indistinguishable from a pass in the report. What actually gets measured
    # here is the two PUBLIC route specs (login, signup). And if anything else
    # on the runner happens to serve :5001, the authenticated project runs
    # after all — nondeterministic either way.
    #
    # The PR-lane guard for the authenticated pages is therefore a jsdom+axe unit
    # test, frontend/src/__tests__/authenticated-pages-a11y.test.tsx, which the
    # `frontend` job's `npm test` runs on every frontend PR. It applies the same
    # blocking bar (zero serious/critical under wcag2a/2aa/21a/21aa) to
    # /settings, /connections and the collapsed Sidebar, but it covers name/role/
    # label rules ONLY — jsdom has no layout or paint, so `color-contrast` is
    # disabled there and can only be measured by this job.
    #
    # Two prerequisites before this can become a blocking PR gate — do NOT flip
    # the `if:` or drop either `continue-on-error` until both are met:
    #   (a) the job must stand up an api-gateway (or set E2E_API_URL at a
    #       reachable one) so the authenticated project runs deterministically
    #       instead of depending on what the runner happens to serve;
    #   (b) the remaining runtime violations on /dashboard and /pipelines — not
    #       yet enumerated, most likely `color-contrast` — must be read out of
    #       the playwright-a11y-report artifact and fixed.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Change detection, inlined -- see "Why there is no `changes` job" above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/paths-filters.yml
      # RUN is this job's only gate. EVERY step below carries `if: env.RUN == '1'`,
      # and llm-service/tests/test_ci_inline_change_filters.py fails if one does not:
      # an unguarded step would work on a PR that changed none of this job's paths,
      # and a step wrongly left outside the gate would report green having done
      # nothing -- KI-DATAPATH-FILTER-EXCLUDES-THE-WORKFLOW, same class.
      - name: Does this job have anything to do?
        env:
          WANTED: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$WANTED" = 'true' ]; then
            echo 'RUN=1' >> "$GITHUB_ENV"
          else
            echo 'RUN=0' >> "$GITHUB_ENV"
            echo '::notice title=Frontend a11y (axe-core) skipped::no path this job filters on changed'
            echo '`Frontend a11y (axe-core)` -- skipped: no path this job filters on changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.RUN == '1'
        with:
          # Kept in lockstep with the frontend job above — the two share one
          # node_modules cache, so they must install under the same Node major.
          node-version: '26'
          # NO `cache: npm` — see the frontend job above for why (avoids
          # ferrying the ~940 MB global ~/.npm cache over the network).
      # CI SPEEDUP: share the same node_modules cache the frontend
      # build job populated. Same key so warm hits skip `npm ci`.
      - name: Cache node_modules
        if: env.RUN == '1'
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/node_modules
          # Node major is IN the key: the two jobs share this cache, and a
          # tree installed under one major must never be restored into another
          # (platform/ABI-specific binaries: esbuild, @swc, lightningcss). The
          # restore-keys prefix carries it too, else the old Node 20 caches
          # would be restored by prefix match and defeat the point.
          key: ${{ runner.os }}-node26-nm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node26-nm-
      - name: Install dependencies
        if: env.RUN == '1' && (steps.nm-cache.outputs.cache-hit != 'true')
        working-directory: frontend
        run: npm ci
      - name: Restore build output
        if: env.RUN == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # `path` must match the save step's byte for byte: it is part of the
          # cache version, so a different spelling is a miss, not a restore.
          path: frontend/frontend-build.tar
          key: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          # "Re-run failed jobs" re-runs this job alone under a new run_attempt,
          # while the build it needs was saved under the attempt that built it.
          restore-keys: |
            frontend-build-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Extract build output
        if: env.RUN == '1'
        working-directory: frontend
        run: tar -xf frontend-build.tar && rm frontend-build.tar
      # CI SPEEDUP: cache Playwright's chromium download. Without
      # this, `playwright install` re-downloads ~100MB every run
      # (~2-4 min). Keyed off package-lock.json so a Playwright
      # version bump (which updates the lock) invalidates correctly.
      #
      # The path is Playwright's LINUX browser cache, and it has to move with
      # the runner. It was ~/Library/Caches/ms-playwright while this job ran on
      # macOS; that directory does not exist on ubuntu-latest, so leaving it
      # would cache nothing and quietly pay the ~100 MB download every run --
      # the speedup this step exists for, not happening and not saying so.
      - name: Cache Playwright browsers
        if: env.RUN == '1'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-
      - name: Install Playwright browsers
        if: env.RUN == '1' && (steps.pw-cache.outputs.cache-hit != 'true')
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run axe-core a11y suite
        if: env.RUN == '1'
        working-directory: frontend
        # Without an api-gateway on :5001 the four authenticated specs SKIP
        # (see the job-level comment above) — so a green result here is not
        # evidence that /dashboard, /connections, /pipelines or /settings are
        # clean; it usually means they were never visited. The step-level
        # `continue-on-error: true`, together with the job-level flag, keeps
        # the check reporting green while still uploading the report.
        # Both flags stay until the authenticated project runs deterministically
        # AND the remaining /dashboard + /pipelines violations are enumerated
        # and fixed; removing them now would turn the nightly red for
        # violations nobody has listed yet.
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_PUBLIC_WS_URL: ws://localhost:5001/ws
        run: npm run test:a11y
      - name: Upload report on failure
        if: env.RUN == '1' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-a11y-report
          path: frontend/playwright-a11y-report
          retention-days: 7
